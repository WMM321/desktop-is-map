<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>桌面即地图 · 第1关 可玩原型</title>
<style>
  html,body{margin:0;height:100%;background:#080808;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"SimSun","MS Sans Serif",Tahoma,sans-serif}
  #stage{position:relative;width:min(96vw,960px);aspect-ratio:16/9;box-shadow:0 0 80px #000 inset}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.10) 0 1px,rgba(0,0,0,0) 1px 4px)}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 62%,rgba(0,0,0,.38) 100%)}
  #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4)}
  .dlg{width:min(76%,620px);background:#c0c0c0;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #404040;border-bottom:2px solid #404040;padding:2px}
  .tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-size:13px;padding:3px 7px;font-family:Tahoma,"SimSun"}
  .bd{padding:12px 16px;color:#000;font-size:13px;line-height:1.65}
  .bd b{font-size:14px}
  table{width:100%;border-collapse:collapse;margin:6px 0}
  td{padding:3px 6px;font-size:12px}
  td:first-child{width:88px;color:#000080;font-weight:700}
  .small{color:#404040;font-size:12px;margin-top:6px}
  button{font-family:inherit;font-size:13px;padding:4px 24px;background:#c0c0c0;
    border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #404040;border-bottom:2px solid #404040;cursor:pointer}
  button:active{border-top:2px solid #404040;border-left:2px solid #404040;border-right:2px solid #fff;border-bottom:2px solid #fff}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div class="scan"></div><div class="vig"></div>
  <div id="start">
    <div class="dlg">
      <div class="tb">桌面即地图.exe — 第 1 关「我的电脑」</div>
      <div class="bd">
        <b>你的电脑中毒了。你是仅剩的两个光标。</b>
        <table>
          <tr><td>白箭头 P1</td><td>A / D 移动　W 跳跃　R 复原队友</td></tr>
          <tr><td>手形 P2</td><td>← / → 移动　↑ 悬停激活　↓ 推动窗口</td></tr>
          <tr><td>P 键</td><td>切换 P2 光标造型（手形 / 十字准星 / I 型）</td></tr>
        </table>
        <div class="small">目标：踩住压力板 → 手形悬停开文件夹门 → 把窗口推入断崖当桥 → 两人一起站上软盘</div>
        <div style="text-align:center;margin-top:14px"><button id="btnStart">开 始</button></div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

var W = 320, H = 180;
var GRAV = 760, JUMP = -218, SPD = 80, SPD_HAND = 68, SPD_DRAG = 48, MAXVY = 430;

/* ---------------- 关卡几何 ---------------- */
var G = {
  grounds: [
    {x:0,   y:136, w:176, h:24},
    {x:224, y:136, w:24,  h:24},
    {x:264, y:136, w:56,  h:24}
  ],
  plate:  {x:24,  y:132, w:32, h:4},
  door:   {x:96,  y:104, w:16, h:32},
  crateY: 128,
  crateX0:128,
  bridgeX:176,
  gap:    {x:176, y:136, w:48, h:24},
  crumble:{x:248, y:132, w:16, h:4},
  exit:   {x:283, y:112, w:30, h:24}
};

/* ---------------- 状态 ---------------- */
var crate, state, P1, P2, started = false;

function reset(){
  crate = {x:G.crateX0, y:G.crateY, w:48, h:8, grabbed:false};
  state = {doorOpen:false, charge:0, bridge:false, crumbleT:0, crumbleBroken:false, crumbleRegen:0,
           winT:0, win:false, t:0, msg:'', msgT:0};
  P1 = {x:16, y:126, w:10, h:10, vx:0, vy:0, onGround:false, deleted:0, rev:0, dead:null, lastSafe:{x:16,y:126}};
  P2 = {x:44, y:126, w:10, h:10, vx:0, vy:0, onGround:false, deleted:0, rev:0, dead:null, lastSafe:{x:44,y:126}};
}
reset();

/* ---------------- 输入 ---------------- */
var keys = {}, prev = {}, jumpBuf = 0;
function pressed(k){ return !!keys[k] && !prev[k]; }
function snapKeys(){ for(var k in keys) prev[k] = keys[k]; }

addEventListener('keydown', function(e){
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code) >= 0) e.preventDefault();
  if(!keys[e.code] && started === false && e.code === 'Enter'){ startGame(); }
  if(e.code === 'KeyW' && !e.repeat) jumpBuf = 0.12;
  /* P 键切换 P2 的光标造型，方便对比辨识度 */
  if(e.code === 'KeyP' && !e.repeat && started){
    cursorStyle = (cursorStyle + 1) % CURSORS.length;
    state.msg = '光标：' + CURSORS[cursorStyle];
    state.msgT = 1.4;
    beep(620, .05);
  }
  keys[e.code] = true;
});
addEventListener('keyup', function(e){ keys[e.code] = false; });

/* ---------------- 音效 ---------------- */
var ac = null;
function beep(f, d){
  if(!f) f = 440; if(!d) d = .08;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = f;
    g.gain.value = 0.035;
    o.connect(g); g.connect(ac.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.stop(ac.currentTime + d + .02);
  }catch(err){}
}

/* ---------------- 碰撞 ---------------- */
function hit(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function solids(){
  var a = G.grounds.slice();
  if(!state.doorOpen) a.push(G.door);
  if(!state.crumbleBroken) a.push(G.crumble);
  if(state.bridge) a.push({x:G.bridgeX, y:crate.y, w:48, h:8});
  else if(!crate.grabbed) a.push({x:crate.x, y:crate.y, w:48, h:8});
  return a;
}
function stepPlayer(p, dt, list){
  p.vy = Math.min(p.vy + GRAV * dt, MAXVY);

  /* 水平 + 自动上台阶（<=14px） */
  p.x += p.vx * dt;
  for(var i = 0; i < list.length; i++){
    var s = list[i];
    if(!hit(p, s)) continue;
    var step = (p.y + p.h) - s.y;
    if(step > 0 && step <= 14){
      p.y = s.y - p.h;
    }else if(p.vx > 0){
      p.x = s.x - p.w;
    }else if(p.vx < 0){
      p.x = s.x + s.w;
    }
  }
  if(p.x < 0) p.x = 0;
  if(p.x + p.w > W) p.x = W - p.w;

  /* 垂直 */
  p.onGround = false;
  p.y += p.vy * dt;
  for(var j = 0; j < list.length; j++){
    var t = list[j];
    if(!hit(p, t)) continue;
    if(p.vy > 0){ p.y = t.y - p.h; p.vy = 0; p.onGround = true; }
    else if(p.vy < 0){ p.y = t.y + t.h; p.vy = 0; }
  }
}

/* ---------------- 删除 / 复原 ---------------- */
function tryDelete(p){
  if(p.deleted > 0) return;
  if(p.y > 176){
    p.dead = {x: Math.max(12, Math.min(W - 12, p.x + p.w / 2)), y: 150};
    p.deleted = 8;
    p.rev = 0;
    p.x = -200; p.y = -400; p.vx = 0; p.vy = 0;
    beep(160, .28);
  }
}
function revive(p){
  p.x = p.lastSafe.x; p.y = p.lastSafe.y; p.vx = 0; p.vy = 0;
  p.deleted = 0; p.rev = 0; p.dead = null;
}

/* ---------------- 逻辑更新 ---------------- */
function update(dt){
  state.t += dt;
  if(state.msgT > 0) state.msgT -= dt;

  var plateOn = P1.deleted <= 0 && P1.onGround &&
                P1.x + P1.w > G.plate.x - 4 && P1.x < G.plate.x + G.plate.w + 4 &&
                Math.abs(P1.y + P1.h - 136) < 2;

  /* P1 */
  P1.vx = 0;
  if(P1.deleted <= 0){
    if(keys.KeyA) P1.vx = -SPD;
    if(keys.KeyD) P1.vx = SPD;
  }
  /* 跳跃（带输入缓冲，防止按键在两帧之间被吞掉） */
  if(jumpBuf > 0 && P1.deleted <= 0){
    jumpBuf -= dt;
    if(P1.onGround){ P1.vy = JUMP; jumpBuf = 0; beep(560, .05); }
  }

  /* P2 */
  P2.vx = 0;
  if(P2.deleted <= 0){
    var sp = crate.grabbed ? SPD_DRAG : SPD_HAND;
    if(keys.ArrowLeft) P2.vx = -sp;
    if(keys.ArrowRight) P2.vx = sp;
  }

  /* 拖窗口 */
  if(keys.ArrowDown && !state.bridge && !crate.grabbed && P2.deleted <= 0 &&
     hit(P2, {x:crate.x - 14, y:crate.y - 16, w:48 + 28, h:40})){
    crate.grabbed = true;
  }
  if(!keys.ArrowDown && crate.grabbed){
    crate.grabbed = false;
    if(crate.x >= 168){ crate.x = G.bridgeX; state.bridge = true; beep(700, .12); }
    else { crate.x = G.crateX0; beep(300, .05); }
  }
  if(crate.grabbed){
    crate.x = Math.max(G.crateX0, Math.min(G.bridgeX, P2.x + 16));
  }

  /* 物理 */
  var S = solids();
  if(P1.deleted <= 0) stepPlayer(P1, dt, S);
  if(P2.deleted <= 0) stepPlayer(P2, dt, S);

  /* 记录安全点 */
  var ps = [P1, P2];
  for(var i = 0; i < 2; i++){
    var p = ps[i];
    if(p.deleted > 0 || !p.onGround) continue;
    var feet = p.y + p.h;
    if(Math.abs(feet - 136) < 1 || Math.abs(feet - 120) < 1){
      p.lastSafe = {x:p.x, y:p.y};
    }
  }
  /* 拖窗口时落点补记 */
  if(P2.deleted <= 0 && P2.onGround && Math.abs(P2.y + P2.h - 128) < 1){
    P2.lastSafe = {x:P2.x, y:P2.y};
  }

  /* 压力板 + 悬停开门 */
  var nearDoor = P2.deleted <= 0 && Math.abs((P2.x + 5) - (G.door.x + 8)) < 54;
  if(!state.doorOpen){
    if(plateOn && nearDoor && keys.ArrowUp){
      state.charge += dt;
      if(state.charge >= 1.5){ state.doorOpen = true; beep(880, .22); }
    }else{
      state.charge = Math.max(0, state.charge - dt * 1.6);
    }
  }

  /* 失效快捷方式碎裂（快速通过安全，停留会被删） */
  if(!state.crumbleBroken && state.doorOpen){
    for(var m = 0; m < 2; m++){
      var q = ps[m];
      if(q.deleted > 0 || !q.onGround) continue;
      if(Math.abs(q.y + q.h - G.crumble.y) < 2 &&
         q.x + q.w > G.crumble.x && q.x < G.crumble.x + G.crumble.w){
        state.crumbleT += dt;
        if(state.crumbleT > 0.55){ state.crumbleBroken = true; beep(230, .14); }
      }
    }
  }
  /* 2.5 秒后地板自动修复，避免通路被永久切断 */
  if(state.crumbleBroken){
    state.crumbleRegen += dt;
    if(state.crumbleRegen > 2.5){
      state.crumbleBroken = false; state.crumbleT = 0; state.crumbleRegen = 0;
    }
  }

  tryDelete(P1); tryDelete(P2);

  /* 复原 */
  for(var a = 0; a < 2; a++){
    var me = a === 0 ? P1 : P2;
    var other = a === 0 ? P2 : P1;
    if(me.deleted <= 0) continue;
    me.deleted -= dt;
    if(me.deleted <= 0){ revive(me); continue; }
    if(other.deleted <= 0 && keys.KeyR && me.dead &&
       Math.abs((other.x + 5) - me.dead.x) < 48){
      me.rev += dt;
      if(me.rev >= 0.85){ revive(me); beep(1100, .18); }
    }else{
      me.rev = Math.max(0, me.rev - dt);
    }
  }

  /* 终点 */
  if(!state.win){
    var ok = P1.deleted <= 0 && P2.deleted <= 0 && P1.onGround && P2.onGround &&
             P1.x > 274 && P2.x > 274;
    if(ok){
      state.winT += dt;
      if(state.winT >= 1){ state.win = true; beep(1200, .35); }
    }else{
      state.winT = Math.max(0, state.winT - dt * 2);
    }
  }
}

/* ---------------- 绘图工具 ---------------- */
function panel(x, y, w, h){
  ctx.fillStyle = '#c0c0c0'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y, 1, h);
  ctx.fillStyle = '#808080'; ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x + w - 1, y, 1, h);
}
function txt(s, x, y, color, size, align, shadow){
  ctx.font = (size || 8) + 'px SimSun,Tahoma,sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  if(shadow){
    ctx.fillStyle = 'rgba(0,36,36,.8)';
    ctx.fillText(s, x + 0.5, y + 0.5);
  }
  ctx.fillStyle = color || '#000';
  ctx.fillText(s, x, y);
}
function drawWin(x, y, w, h, title){
  panel(x, y, w, h);
  var g = ctx.createLinearGradient(x, y, x + w, y);
  g.addColorStop(0, '#000080'); g.addColorStop(1, '#2a89d8');
  ctx.fillStyle = g; ctx.fillRect(x + 1, y + 1, w - 2, 11);
  ctx.fillStyle = '#c0c0c0'; ctx.fillRect(x + w - 12, y + 3, 9, 7);
  ctx.fillStyle = '#000'; ctx.font = '7px Tahoma'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('x', x + w - 7.5, y + 7);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  txt(title, x + 4, y + 2, '#fff', 8);
}

/* ---------------- 场景绘制 ---------------- */
function drawGround(r){
  panel(r.x, r.y, r.w, r.h);
  ctx.fillStyle = 'rgba(0,0,0,.07)';
  for(var i = r.x + 3; i < r.x + r.w; i += 4)
    for(var j = r.y + 5; j < r.y + r.h; j += 4) ctx.fillRect(i, j, 1, 1);
  ctx.fillStyle = '#008080';
  ctx.fillRect(r.x, r.y + r.h, r.w, 1);
}

function drawPlate(){
  var on = P1.deleted <= 0 && P1.onGround &&
           P1.x + P1.w > G.plate.x - 4 && P1.x < G.plate.x + G.plate.w + 4 &&
           Math.abs(P1.y + P1.h - 136) < 2;
  ctx.fillStyle = on ? '#5a5a5a' : '#a0a0a0';
  ctx.fillRect(G.plate.x, G.plate.y, G.plate.w, G.plate.h);
  ctx.fillStyle = '#808080'; ctx.fillRect(G.plate.x, G.plate.y, G.plate.w, 1);
  ctx.fillStyle = on ? '#3fd0d0' : '#6fa8a8';
  ctx.fillRect(G.plate.x + 3, G.plate.y + 1, G.plate.w - 6, 2);
  txt('压力板', G.plate.x + 2, G.plate.y - 11, on ? '#00ffff' : '#d8ffff', 8, 'left', true);
}

function drawDoor(){
  var d = G.door;
  if(!state.doorOpen){
    ctx.fillStyle = '#ffd54a'; ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.fillStyle = '#ffe98a'; ctx.fillRect(d.x + 1, d.y + 1, d.w - 2, d.h - 2);
    ctx.fillStyle = '#c89a00';
    ctx.fillRect(d.x + 5, d.y + 2, d.w - 10, 3);
    ctx.strokeStyle = '#6b5200'; ctx.lineWidth = 1;
    ctx.strokeRect(d.x + .5, d.y + .5, d.w - 1, d.h - 1);
    /* 锁 */
    ctx.fillStyle = '#404040'; ctx.fillRect(d.x + 5, d.y + 16, 6, 5);
    /* 悬停进度 */
    if(state.charge > 0){
      var p = Math.min(1, state.charge / 1.5);
      ctx.fillStyle = '#000080'; ctx.fillRect(d.x - 2, d.y - 8, 20, 5);
      ctx.fillStyle = '#00d0ff'; ctx.fillRect(d.x - 1, d.y - 7, 18 * p, 3);
    }
    txt('我的文档', d.x - 8, d.y - 20, '#d8ffff', 8, 'left', true);
  }else{
    ctx.fillStyle = '#c89a00'; ctx.fillRect(d.x, d.y + 4, d.w, d.h - 4);
    ctx.fillStyle = '#ffe98a'; ctx.fillRect(d.x, d.y, d.w, 6);
    txt('已打开', d.x - 8, d.y - 12, '#00ffff', 8, 'left', true);
  }
}

function drawCrate(){
  var x = state.bridge ? G.bridgeX : crate.x;
  var y = crate.y;
  if(!state.bridge && crate.grabbed){
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(x + 3, y + 10, 48, 3);
  }
  ctx.fillStyle = '#c0c0c0'; ctx.fillRect(x, y, 48, 8);
  var g = ctx.createLinearGradient(x, y, x + 48, y);
  g.addColorStop(0, '#000080'); g.addColorStop(1, '#2a89d8');
  ctx.fillStyle = g; ctx.fillRect(x, y, 48, 6);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y + 6, 48, 1);
  ctx.fillStyle = '#000'; ctx.fillRect(x + 42, y + 1, 5, 4);
  txt(crate.grabbed ? '属性 ←推动' : '属性', x + 2, y, '#fff', 6);
}

function drawCrumble(){
  if(state.crumbleBroken){
    ctx.fillStyle = '#003030';
    ctx.fillRect(G.crumble.x, G.crumble.y + 2, G.crumble.w, 4);
    txt('空', G.crumble.x + 5, G.crumble.y - 11, '#d8ffff', 8, 'left', true);
    return;
  }
  ctx.fillStyle = '#9a9a9a';
  for(var i = 0; i < G.crumble.w; i += 4) ctx.fillRect(G.crumble.x + i, G.crumble.y, 3, 4);
  ctx.strokeStyle = '#606060'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(G.crumble.x + 8, G.crumble.y); ctx.lineTo(G.crumble.x + 6, G.crumble.y + 4);
  ctx.stroke();
  txt('快捷方式', G.crumble.x - 10, G.crumble.y - 11, '#d8ffff', 8, 'left', true);
}

function drawExit(){
  var e = G.exit;
  var lit = state.winT > 0;
  ctx.fillStyle = lit ? '#00c0c0' : '#007070';
  ctx.fillRect(e.x, e.y, 26, 20);
  ctx.fillStyle = '#e8e8e8'; ctx.fillRect(e.x + 6, e.y + 4, 14, 8);
  ctx.fillStyle = '#404040'; ctx.fillRect(e.x + 9, e.y + 4, 4, 8);
  ctx.fillStyle = '#004040'; ctx.fillRect(e.x + 2, e.y + 15, 22, 3);
  ctx.strokeStyle = '#003030'; ctx.lineWidth = 1;
  ctx.strokeRect(e.x + .5, e.y + .5, 25, 19);
  txt('软盘 A:', e.x - 8, e.y - 12, lit ? '#00ffff' : '#d8ffff', 8, 'left', true);
  if(state.winT > 0){
    ctx.fillStyle = '#000080'; ctx.fillRect(e.x, e.y - 4, 26, 3);
    ctx.fillStyle = '#00e0e0'; ctx.fillRect(e.x, e.y - 4, 26 * Math.min(1, state.winT), 3);
  }
}

function arrowShape(x, y, alpha){
  var pts = [[0,0],[0,11],[3,8],[4.8,12],[6.6,11],[4.8,7.5],[8.2,7.5]];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(x + pts[0][0], y + pts[0][1]);
  for(var i = 1; i < pts.length; i++) ctx.lineTo(x + pts[i][0], y + pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = '#000000'; ctx.stroke();
  ctx.restore();
}
/* ---------------- 光标造型（P2 可切换） ---------------- */
var CURSORS = ['手形', '十字准星', 'I 型'];
var cursorStyle = 0;

/* 先用暗色把整组色块膨胀 1px，得到统一外轮廓，再填亮色盖住内部接缝 */
function dilate(parts, x, y){
  ctx.fillStyle = '#12100c';
  for(var i = 0; i < parts.length; i++){
    var r = parts[i];
    ctx.fillRect(x + r[0] - 1, y + r[1] - 1, r[2] + 2, r[3] + 2);
  }
}
function fillParts(parts, x, y, color){
  ctx.fillStyle = color;
  for(var i = 0; i < parts.length; i++){
    var r = parts[i];
    ctx.fillRect(x + r[0], y + r[1], r[2], r[3]);
  }
}
/* 手形：逐像素点阵（15 列 × 16 行），指尖在左上第一格
   '#' = 手体，渲染时自动把边缘涂成描边色、内部涂成米白 */
var HAND_MAP = [
  '...####........',
  '...####........',
  '...####........',
  '...####........',
  '...######......',
  '...########....',
  '...##########..',
  '..############.',
  '..############.',
  '.#############.',
  '##############.',
  '##############.',
  '##############.',
  '..###########..',
  '..##########...',
  '...########....'
];
/* 内部细节：食指与手掌高光、三根蜷指的分界缝 */
var HAND_MARK = [
  [4, 1, 1, 5, '#ffffff'],
  [3, 12, 1, 2, '#ffffff'],
  [6, 4, 1, 4, '#0d0b08'],
  [9, 5, 1, 3, '#0d0b08'],
  [11, 6, 1, 2, '#0d0b08']
];
function mapEdge(map, r, c){
  return map[r].charAt(c - 1) !== '#' || map[r].charAt(c + 1) !== '#' ||
         !map[r - 1] || map[r - 1].charAt(c) !== '#' ||
         !map[r + 1] || map[r + 1].charAt(c) !== '#';
}
function handShape(x, y, alpha){
  x = Math.round(x); y = Math.round(y);
  ctx.save();
  ctx.globalAlpha = alpha;
  var rows = HAND_MAP.length, cols = HAND_MAP[0].length, r, c;
  /* 第一遍：手体填米白 */
  ctx.fillStyle = '#fff6e6';
  for(r = 0; r < rows; r++){
    for(c = 0; c < cols; c++){
      if(HAND_MAP[r].charAt(c) === '#') ctx.fillRect(x + c, y + r, 1, 1);
    }
  }
  /* 第二遍：只描边缘像素，得到 1px 闭合黑边 */
  ctx.fillStyle = '#0d0b08';
  for(r = 0; r < rows; r++){
    for(c = 0; c < cols; c++){
      if(HAND_MAP[r].charAt(c) === '#' && mapEdge(HAND_MAP, r, c)) ctx.fillRect(x + c, y + r, 1, 1);
    }
  }
  /* 第三遍：内部明暗细节 */
  for(var i = 0; i < HAND_MARK.length; i++){
    var m = HAND_MARK[i];
    ctx.fillStyle = m[4];
    ctx.fillRect(x + m[0], y + m[1], m[2], m[3]);
  }
  ctx.restore();
}
/* 十字准星：四段臂 + 中心红点，白色实心 / 近黑描边 */
function crossShape(x, y, alpha){
  x = Math.round(x); y = Math.round(y);
  ctx.save();
  ctx.globalAlpha = alpha;
  var arms = [[6,0,1,5],[6,8,1,5],[0,6,5,1],[8,6,5,1]];
  dilate(arms, x, y);
  fillParts(arms, x, y, '#ffffff');
  ctx.fillStyle = '#ff2424';
  ctx.fillRect(x + 6, y + 6, 1, 1);
  ctx.restore();
}
/* I 型文本光标：竖杠 + 上下横杠 */
function ibeamShape(x, y, alpha){
  x = Math.round(x); y = Math.round(y);
  ctx.save();
  ctx.globalAlpha = alpha;
  var parts = [[5,1,2,13],[3,0,6,1],[3,14,6,1]];
  dilate(parts, x, y);
  fillParts(parts, x, y, '#ffffff');
  ctx.restore();
}
function drawCursor(x, y, alpha){
  if(cursorStyle === 1) crossShape(x, y, alpha);
  else if(cursorStyle === 2) ibeamShape(x, y, alpha);
  else handShape(x, y, alpha);
}
/* 选中框：四角括号，两位玩家各用一种颜色，脉动提示"这是玩家本体" */
function selRing(cx, cy, r, t, color){
  var pulse = 0.4 + Math.abs(Math.sin(t * 3.2)) * 0.55;
  var x0 = Math.round(cx - r), y0 = Math.round(cy - r), k = 4, e = x0 + r * 2, b = y0 + r * 2;
  ctx.save();
  ctx.globalAlpha = pulse * 0.16;
  ctx.fillStyle = color;
  ctx.fillRect(x0, y0, r * 2, r * 2);
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0 + k, y0 + .5); ctx.lineTo(x0 + .5, y0 + .5); ctx.lineTo(x0 + .5, y0 + k);
  ctx.moveTo(e - k, y0 + .5); ctx.lineTo(e - .5, y0 + .5); ctx.lineTo(e - .5, y0 + k);
  ctx.moveTo(x0 + k, b - .5); ctx.lineTo(x0 + .5, b - .5); ctx.lineTo(x0 + .5, b - k);
  ctx.moveTo(e - k, b - .5); ctx.lineTo(e - .5, b - .5); ctx.lineTo(e - .5, b - k);
  ctx.stroke();
  ctx.restore();
}
function drawPlayers(){
  var t = state.t;
  if(P2.deleted > 0){
    drawCursor(P2.dead ? P2.dead.x - 8 : 0, P2.dead ? P2.dead.y - 8 : 0, .3);
  }else{
    selRing(P2.x + 5, P2.y + 5, 10, t, '#ffd23f');
    drawCursor(P2.x - 3, P2.y - 4, 1);
  }
  if(P1.deleted > 0){
    arrowShape(Math.round(P1.dead ? P1.dead.x - 4 : 0), Math.round(P1.dead ? P1.dead.y - 6 : 0), .3);
  }else{
    selRing(P1.x + 5, P1.y + 5, 10, t, '#ffffff');
    arrowShape(Math.round(P1.x + 1), Math.round(P1.y - 1), 1);
  }
  /* 复原进度 */
  var me = P1.deleted > 0 ? P1 : (P2.deleted > 0 ? P2 : null);
  if(me && me.dead){
    txt('已删除 ' + me.deleted.toFixed(1) + 's', me.dead.x - 22, me.dead.y - 24, '#ffffff', 8, 'left', true);
    if(me.rev > 0){
      ctx.fillStyle = '#000080'; ctx.fillRect(me.dead.x - 12, me.dead.y - 10, 24, 4);
      ctx.fillStyle = '#00ff88'; ctx.fillRect(me.dead.x - 12, me.dead.y - 10, 24 * (me.rev / .85), 4);
    }else{
      txt('按住 R', me.dead.x - 14, me.dead.y - 12, '#ffff00', 8, 'left', true);
    }
  }
}

function drawTaskbar(){
  panel(0, 160, W, 20);
  panel(2, 163, 42, 15);
  ctx.fillStyle = '#ff0000'; ctx.fillRect(5, 166, 5, 5);
  ctx.fillStyle = '#00ff00'; ctx.fillRect(10, 166, 5, 5);
  ctx.fillStyle = '#0000ff'; ctx.fillRect(5, 171, 5, 5);
  ctx.fillStyle = '#ffff00'; ctx.fillRect(10, 171, 5, 5);
  txt('开始', 18, 167, '#000', 8);
  ctx.fillStyle = '#808080'; ctx.fillRect(50, 164, 1, 12);
  txt('我的电脑 - 第1关', 56, 167, '#000', 8);
  panel(288, 163, 28, 14);
  txt('22:07', 292, 167, '#000', 8);
}

function drawPad(){
  drawWin(156, 4, 160, 92, '任务.txt - 记事本');
  var plateOn = P1.deleted <= 0 && P1.onGround &&
                P1.x + P1.w > G.plate.x - 4 && P1.x < G.plate.x + G.plate.w + 4 &&
                Math.abs(P1.y + P1.h - 136) < 2;
  var cur;
  if(P1.deleted > 0 || P2.deleted > 0) cur = 4;
  else if(!state.doorOpen) cur = plateOn ? 1 : 0;
  else if(!state.bridge) cur = 2;
  else if(!(P1.x > 240 && P2.x > 240)) cur = 3;
  else cur = 5;
  var lines = [
    '① 箭头站上压力板',
    '② 手形按住 ↑ 悬停开门',
    '③ 手形按住 ↓ 把窗口推入断崖',
    '④ 两人一起走到右边',
    '⑤ 按住 R 复原队友',
    '⑥ 两人站上软盘 1 秒'
  ];
  for(var i = 0; i < lines.length; i++){
    var done = i < cur;
    var color = done ? '#a0a0a0' : (i === cur ? '#000080' : '#303030');
    txt((i === cur ? '>' : ' ') + lines[i], 163, 20 + i * 12, color, 9);
  }
}

function drawWinDialog(){
  drawWin(78, 56, 164, 68, '系统');
  txt('3 个文件已还原。', 88, 74, '#000', 9);
  txt('C:\\ 盘有个东西在动...', 88, 88, '#000', 9);
  ctx.fillStyle = '#000080'; ctx.fillRect(88, 104, 60, 10);
  ctx.fillStyle = '#00d0ff';
  for(var i = 0; i < 6; i++) ctx.fillRect(90 + i * 9, 107, 7, 4);
  txt('按 Enter 重来', 156, 105, '#000', 8);
}

function drawDeskIcons(){
  var ic = [['#ffd700', '我的电脑', 10], ['#c0c0c0', '回收站', 44]];
  for(var i = 0; i < ic.length; i++){
    var x = 8, y = ic[i][2];
    ctx.globalAlpha = .85;
    ctx.fillStyle = ic[i][0]; ctx.fillRect(x, y, 11, 10);
    ctx.strokeStyle = '#003030'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, 10, 9);
    ctx.globalAlpha = 1;
    txt(ic[i][1], x - 3, y + 13, '#e8ffff', 8, 'left', true);
  }
}

function render(){
  var S = cv.width / W;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.fillStyle = '#008080';
  ctx.fillRect(0, 0, W, H);
  drawDeskIcons();
  for(var i = 0; i < G.grounds.length; i++) drawGround(G.grounds[i]);
  drawPlate();
  drawDoor();
  drawCrate();
  drawCrumble();
  drawExit();
  drawPlayers();
  drawTaskbar();
  if(state.msgT > 0) txt(state.msg, 200, 166, '#000080', 8);
  drawPad();
  if(state.win) drawWinDialog();
}

/* ---------------- 主循环 ---------------- */
var last = 0;
function loop(ts){
  var dt = last ? Math.min(.033, (ts - last) / 1000) : 0;
  last = ts;
  if(started && !state.win) update(dt);
  if(started && state.win && pressed('Enter')) reset();
  render();
  snapKeys();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGame(){
  document.getElementById('start').style.display = 'none';
  started = true;
  beep(760, .12);
}

/* 调试钩子：供自动化测试读取状态 */
window.__g = function(){
  return {p1x:P1.x, p1y:P1.y, p2x:P2.x, p2y:P2.y,
          door:state.doorOpen, bridge:state.bridge, win:state.win, started:started};
};
document.getElementById('btnStart').addEventListener('click', startGame);
})();
</script>
